<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420"><style>text{font-family:Arial;font-size:16px} .box{fill:#f2f2f2;stroke:#1f4e78;stroke-width:2}.arrow{stroke:#666;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#666"/></marker></defs><rect class="box" x="30" y="160" width="130" height="70" rx="6"/><text x="55" y="188">Raw CSVs</text><text x="50" y="210">17 tables</text><rect class="box" x="220" y="160" width="150" height="70" rx="6"/><text x="255" y="188">Staging</text><text x="240" y="210">types + checks</text><rect class="box" x="430" y="160" width="150" height="70" rx="6"/><text x="465" y="188">Clean</text><text x="447" y="210">dedupe + flags</text><rect class="box" x="640" y="160" width="150" height="70" rx="6"/><text x="667" y="188">Golden</text><text x="652" y="210">account level</text><rect class="box" x="850" y="160" width="180" height="70" rx="6"/><text x="890" y="188">Metrics / Dashboard</text><text x="892" y="210">CEO view</text><line class="arrow" x1="160" y1="195" x2="220" y2="195"/><line class="arrow" x1="370" y1="195" x2="430" y2="195"/><line class="arrow" x1="580" y1="195" x2="640" y2="195"/><line class="arrow" x1="790" y1="195" x2="850" y2="195"/><text x="40" y="70" font-size="22">CredResolve production analytics design</text><text x="40" y="330">DQ checks: duplicates • missing IDs • timestamp/timezone checks • payment deduplication</text><text x="40" y="360">Late-arriving data: incremental loads + periodic backfill • Metrics defined once in the golden/metrics layer</text></svg>